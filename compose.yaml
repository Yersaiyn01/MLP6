x-app: &app
  image: german-credit-sis3:local
  build:
    context: .

services:
  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:5001,127.0.0.1:5001
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  train:
    <<: *app
    command: ["python", "train.py"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: german-credit
      MLFLOW_MODEL_NAME: german-credit-logistic-regression
      MODEL_PATH: /models/model.joblib
    volumes:
      - model-artifacts:/models
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      MODEL_PATH: /models/model.joblib
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-artifacts:/models:ro
    depends_on:
      train:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  frontend:
    <<: *app
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
      - --browser.gatherUsageStats
      - "false"
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 5s
      timeout: 8s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  mlflow-data:
  model-artifacts:
